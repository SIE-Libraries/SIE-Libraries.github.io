<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sie Library — Redirecting...</title>

  <!-- Instant Meta Refresh Redirect -->
  <meta http-equiv="refresh" content="0; url=/projects/project-cyclohexane">
  <link rel="canonical" href="/projects/project-cyclohexane">

  <script>
    // Immediate JavaScript redirect
    window.location.replace("/projects/project-cyclohexane");
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f17;
      --surface: #121826;
      --surface-border: #242f49;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .redirect-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      margin: 0 auto 1.25rem;
      background: linear-gradient(135deg, #38bdf8, #6366f1);
      border-radius: 12px;
      display: grid;
      place-items: center;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      color: #0b0f17;
      box-shadow: 0 0 25px var(--accent-glow);
    }

    .spinner {
      width: 28px;
      height: 28px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      margin: 1rem auto 1.5rem;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: #0b0f17;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
      padding: 0.75rem 1.5rem;
      border-radius: 9999px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: #7dd3fc;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>

  <div class="redirect-card">
    <div class="brand-logo">Sie</div>
    <div class="spinner"></div>
    <h1>Sie Library</h1>
    <p>Redirecting you to <strong>/projects/project-cyclohexane</strong>...</p>
    <a href="/projects/project-cyclohexane" class="btn">Click here if not redirected</a>
  </div>

</body>
</html>
